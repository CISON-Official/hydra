<!-- templates/expired.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Expired - {{ certificate_title }}</title>
    <link rel="stylesheet" href="/static/viewer.css" />
</head>

<body>
    <div class="expired-container card">
        <div class="expired-icon">⏰</div>
        <h1 class="expired-title">Certificate Expired</h1>
        <div class="expiry-date">Expired on: {{ expires_at.strftime('%B %d, %Y') }}</div>
        <div class="expired-message">
            This certificate is no longer valid.<br>
            Please contact the issuer for a renewed version.
        </div>
        <button class="btn" id="reloadBtn">Check Again</button>
    </div>

    <script src="/static/expired.js"></script>
</body>

</html>
